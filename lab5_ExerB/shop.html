<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Bookstore</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="shop.css">
    <style>
        h1 { text-align: center; }
    </style>
</head>
<body>
<!--
    Error 1 (shop.html, Line 7): rel="stylesheets" is misspelled; changed to rel="stylesheet".
    Error 2 (shop.html, Line 10): <style> tag was inside <body>; moved into <head>.
    Error 3 (shop.html, Line 18): Inline style used "=" instead of ":" (color=#1B4F72;); fixed syntax.
    Error 4 (shop.html, Line 20): Table id was "product" instead of "products", preventing CSS rules from applying.
    Error 5 (shop.css, Line 2): Font family 'Robotto' was misspelled; corrected to 'Roboto'.
    Error 6 (shop.css, Line 4): background-repeat value "no repeat" lacked a hyphen; changed to "no-repeat".
    Error 7 (shop.css, Line 5): Property "bacground-position" was misspelled; corrected to "background-position".
    Error 8 (shop.css, Line 18): li a had "display: inline" which breaks vertical padding; changed to "display: block".
    Error 9 (shop.css, Line 23): Selector "li:a:hover" used a colon instead of a space; changed to "li a:hover".
    Error 10 (shop.css, Line 27): "border-collapse: collapsed" is invalid; changed to "collapse".
    Error 11 (shop.css, Line 34): "tr:nth-child(2)" only highlighted row 2; changed to "tr:nth-child(even)".
    Error 12 (shop.css, Line 37): Pseudo-class "tr:hovered" is invalid; changed to "tr:hover".
    Error 13 (shop.css, Line 45): Missing semicolon at the end of "background-color: #f1f1f1".
-->

    <!-- Header Section -->
    <header>
        <h1>Campus Bookstore</h1>
        <p>Textbooks, stationery and more for every student.</p>
    </header>

    <!-- Horizontal Navigation Bar -->
    <nav>
        <ul>
            <li><a href="#home" class="active">Home</a></li>
            <li><a href="#books">Books</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main>
        <!-- Fixed id="products" -->
        <table id="products">
            <thead>
                <tr>
                    <th>Item</th>
                    <th>Category</th>
                    <th class="price">Price (RM)</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Web Design Basics</td>
                    <td>Textbook</td>
                    <td class="price">45.00</td>
                </tr>
                <tr>
                    <td>A4 Notebook</td>
                    <td>Stationery</td>
                    <td class="price">6.50</td>
                </tr>
                <tr>
                    <td>USB Drive 32GB</td>
                    <td>Gadget</td>
                    <td class="price">25.00</td>
                </tr>
                <tr>
                    <td>Highlighter Set</td>
                    <td>Stationery</td>
                    <td class="price">9.90</td>
                </tr>
            </tbody>
        </table>
    </main>

    <!-- Footer Section -->
    <footer id="contact">
        &copy; 2026 Campus Bookstore
    </footer>

</body>
</html>
